<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Based AI Ergonomic Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
        }

        #hud, .chart-panel, .summary-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .video-box {
            position: relative;
            width: 100%;
            min-height: 240px;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none;
        }

        #output_canvas {
            position: relative;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
        }

        #historyChart {
            display: block;
            width: 100%;
            height: 240px;
            background: #1b1b1b;
            border-radius: 5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: normal;
            color: #ddd;
        }

        .summary-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 8px;
        }

        .summary-box strong {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .legend {
            font-size: 12px;
            font-weight: normal;
            color: #ccc;
            margin-top: 8px;
        }

        .legend span {
            margin: 0 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            background-color: #0288d1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 4px 10px;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #cameraControl.stop {
            background-color: #d32f2f;
        }

        #clearHistory, #exportCsv {
            background-color: #616161;
        }

        .chart-title, .summary-title {
            margin: 0 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📐 Web Ergonomic AI Evaluator</h2>

        <div id="hud">
            Status: <span style="color: #ff9800;">Camera is off. Press Start Camera when ready.</span>
        </div>

        <button id="cameraControl">▶️ Start Camera</button>
        <button id="toggleCam" disabled>🔄 Switch Camera (Front/Back)</button>

        <div class="video-box">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <section class="chart-panel">
            <h3 class="chart-title">📈 Posture History</h3>
            <canvas id="historyChart" width="680" height="240"></canvas>
            <div class="legend">
                <span style="color:#00E676">● Low risk</span>
                <span style="color:#FFEA00">● Medium risk</span>
                <span style="color:#FF1744">● High risk</span>
                <span>Angle over the last 60 seconds</span>
            </div>
            <div style="margin-top: 10px;">
                <button id="clearHistory">🗑️ Clear History</button>
                <button id="exportCsv">📤 Export CSV</button>
            </div>
        </section>

        <section class="summary-panel">
            <h3 class="summary-title">📊 Session Summary</h3>
            <div class="summary-grid">
                <div class="summary-box"><strong>Duration</strong><span id="summaryDuration">00:00</span></div>
                <div class="summary-box"><strong>Samples</strong><span id="summarySamples">0</span></div>
                <div class="summary-box"><strong>Average Angle</strong><span id="summaryAverage">0°</span></div>
                <div class="summary-box"><strong>Current Risk</strong><span id="summaryCurrent">--</span></div>
                <div class="summary-box"><strong>Low Risk</strong><span id="summaryLow">0%</span></div>
                <div class="summary-box"><strong>Medium Risk</strong><span id="summaryMedium">0%</span></div>
                <div class="summary-box"><strong>High Risk</strong><span id="summaryHigh">0%</span></div>
                <div class="summary-box"><strong>Alerts</strong><span id="summaryAlerts">0</span></div>
            </div>
        </section>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const cameraControlBtn = document.getElementById('cameraControl');
        const toggleCamBtn = document.getElementById('toggleCam');
        const historyCanvas = document.getElementById('historyChart');
        const historyCtx = historyCanvas.getContext('2d');
        const clearHistoryBtn = document.getElementById('clearHistory');
        const exportCsvBtn = document.getElementById('exportCsv');

        let useBackCamera = true;
        let activeStream = null;
        let camera = null;
        let isCameraRunning = false;
        let lastHistorySample = 0;
        let sessionStartTime = null;
        let sessionAlertCount = 0;
        let alertTimerStart = null;
        let alertTriggered = false;
        const postureHistory = [];
        const MAX_HISTORY_POINTS = 60;
        const SAMPLE_INTERVAL_MS = 1000;

        function setStatus(message, color = '#ff9800') {
            hud.innerHTML = `Status: <span style="color:${color};">${message}</span>`;
        }

        function getRiskFromAngle(angle) {
            const deviation = Math.abs(180 - angle);
            if (deviation <= 15) return { level: 'low', label: 'LOW RISK', color: '#00E676' };
            if (deviation <= 30) return { level: 'medium', label: 'MEDIUM RISK', color: '#FFEA00' };
            return { level: 'high', label: 'HIGH RISK', color: '#FF1744' };
        }

        function updateSessionSummary() {
            const total = postureHistory.length;
            if (total === 0) {
                document.getElementById('summaryDuration').textContent = '00:00';
                document.getElementById('summarySamples').textContent = '0';
                document.getElementById('summaryAverage').textContent = '0°';
                document.getElementById('summaryCurrent').textContent = '--';
                document.getElementById('summaryLow').textContent = '0%';
                document.getElementById('summaryMedium').textContent = '0%';
                document.getElementById('summaryHigh').textContent = '0%';
                document.getElementById('summaryAlerts').textContent = '0';
                return;
            }

            const durationMs = (postureHistory[postureHistory.length - 1].time - postureHistory[0].time) || 0;
            const durationSec = Math.max(0, Math.floor(durationMs / 1000));
            const minutes = String(Math.floor(durationSec / 60)).padStart(2, '0');
            const seconds = String(durationSec % 60).padStart(2, '0');

            const totalAngle = postureHistory.reduce((sum, point) => sum + point.angle, 0);
            const avgAngle = Math.round(totalAngle / total);
            const currentRisk = postureHistory[postureHistory.length - 1].level;

            const lowCount = postureHistory.filter((point) => point.level === 'low').length;
            const mediumCount = postureHistory.filter((point) => point.level === 'medium').length;
            const highCount = postureHistory.filter((point) => point.level === 'high').length;

            document.getElementById('summaryDuration').textContent = `${minutes}:${seconds}`;
            document.getElementById('summarySamples').textContent = total;
            document.getElementById('summaryAverage').textContent = `${avgAngle}°`;
            document.getElementById('summaryCurrent').textContent = currentRisk.toUpperCase();
            document.getElementById('summaryLow').textContent = `${Math.round((lowCount / total) * 100)}%`;
            document.getElementById('summaryMedium').textContent = `${Math.round((mediumCount / total) * 100)}%`;
            document.getElementById('summaryHigh').textContent = `${Math.round((highCount / total) * 100)}%`;
            document.getElementById('summaryAlerts').textContent = sessionAlertCount;
        }

        function recordPosture(angle, risk) {
            const now = Date.now();
            if (now - lastHistorySample < SAMPLE_INTERVAL_MS) return;
            lastHistorySample = now;

            const entry = {
                time: now,
                angle,
                level: risk.level,
                label: risk.label,
                color: risk.color
            };

            postureHistory.push(entry);
            if (postureHistory.length > MAX_HISTORY_POINTS) postureHistory.shift();

            if (risk.level === 'high') {
                if (!alertTimerStart) {
                    alertTimerStart = now;
                } else if (now - alertTimerStart >= 10000) {
                    if (!alertTriggered) {
                        sessionAlertCount += 1;
                        alertTriggered = true;
                        setStatus('⚠️ High-risk posture detected for 10 seconds', '#FF1744');
                        if ('vibrate' in navigator) navigator.vibrate([250, 100, 250]);
                    }
                }
            } else {
                alertTimerStart = null;
                alertTriggered = false;
            }

            updateSessionSummary();
            drawHistoryChart();
        }

        function drawHistoryChart() {
            const width = historyCanvas.width;
            const height = historyCanvas.height;
            const padding = { top: 20, right: 16, bottom: 28, left: 42 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            historyCtx.clearRect(0, 0, width, height);
            historyCtx.fillStyle = '#1b1b1b';
            historyCtx.fillRect(0, 0, width, height);

            const angleToY = (angle) => {
                const clamped = Math.max(0, Math.min(180, angle));
                return padding.top + ((180 - clamped) / 180) * chartHeight;
            };

            historyCtx.fillStyle = 'rgba(0, 230, 118, 0.12)';
            historyCtx.fillRect(padding.left, angleToY(180), chartWidth, angleToY(165) - angleToY(180));

            historyCtx.fillStyle = 'rgba(255, 234, 0, 0.10)';
            historyCtx.fillRect(padding.left, angleToY(165), chartWidth, angleToY(150) - angleToY(165));

            historyCtx.fillStyle = 'rgba(255, 23, 68, 0.10)';
            historyCtx.fillRect(padding.left, angleToY(150), chartWidth, chartHeight - (angleToY(150) - padding.top));

            historyCtx.strokeStyle = '#555';
            historyCtx.lineWidth = 1;
            historyCtx.fillStyle = '#aaa';
            historyCtx.font = '11px sans-serif';

            [180, 135, 90, 45, 0].forEach((value) => {
                const yPosition = angleToY(value);
                historyCtx.beginPath();
                historyCtx.moveTo(padding.left, yPosition);
                historyCtx.lineTo(width - padding.right, yPosition);
                historyCtx.stroke();
                historyCtx.fillText(`${value}°`, 5, yPosition + 4);
            });

            if (postureHistory.length === 0) {
                historyCtx.fillStyle = '#aaa';
                historyCtx.textAlign = 'center';
                historyCtx.fillText('Start the camera to record posture history', width / 2, height / 2);
                historyCtx.textAlign = 'left';
                return;
            }

            historyCtx.beginPath();
            postureHistory.forEach((point, index) => {
                const x = postureHistory.length === 1
                    ? padding.left + chartWidth / 2
                    : padding.left + (index / (postureHistory.length - 1)) * chartWidth;
                const y = angleToY(point.angle);
                if (index === 0) historyCtx.moveTo(x, y);
                else historyCtx.lineTo(x, y);
            });
            historyCtx.strokeStyle = '#29B6F6';
            historyCtx.lineWidth = 2;
            historyCtx.stroke();

            postureHistory.forEach((point, index) => {
                const x = postureHistory.length === 1
                    ? padding.left + chartWidth / 2
                    : padding.left + (index / (postureHistory.length - 1)) * chartWidth;
                historyCtx.fillStyle = point.color;
                historyCtx.beginPath();
                historyCtx.arc(x, angleToY(point.angle), 4, 0, 2 * Math.PI);
                historyCtx.fill();
            });
        }

        function exportCsv() {
            if (postureHistory.length === 0) {
                setStatus('No posture data to export yet.', '#FFEA00');
                return;
            }

            const rows = [
                ['timestamp','angle','risk'],
                ...postureHistory.map((point) => [new Date(point.time).toISOString(), point.angle.toFixed(1), point.label])
            ];

            const csv = rows.map((row) => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'ergonomic_posture_history.csv';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            setStatus('CSV export downloaded successfully.', '#00E676');
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            if (!isCameraRunning) return;

            const width = video.videoWidth || 640;
            const height = video.videoHeight || 480;
            if (canvas.width !== width || canvas.height !== height) {
                canvas.width = width;
                canvas.height = height;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (!results.poseLandmarks) {
                setStatus('Awaiting human target presence...', '#aaa');
                return;
            }

            const shoulder = results.poseLandmarks[11];
            const hip = results.poseLandmarks[23];
            const knee = results.poseLandmarks[25];
            if (!shoulder || !hip || !knee) return;

            const angle = calculateAngle(shoulder, hip, knee);
            const risk = getRiskFromAngle(angle);
            recordPosture(angle, risk);

            hud.innerHTML = `Angle: ${Math.round(angle)}° | Risk: <span style="color:${risk.color}">${risk.label}</span>`;

            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(3, canvas.width / 160);
            ctx.beginPath();
            ctx.moveTo(shoulder.x * canvas.width, shoulder.y * canvas.height);
            ctx.lineTo(hip.x * canvas.width, hip.y * canvas.height);
            ctx.lineTo(knee.x * canvas.width, knee.y * canvas.height);
            ctx.stroke();

            [shoulder, hip, knee].forEach((joint) => {
                ctx.fillStyle = '#00B0FF';
                ctx.beginPath();
                ctx.arc(joint.x * canvas.width, joint.y * canvas.height, Math.max(6, canvas.width / 80), 0, 2 * Math.PI);
                ctx.fill();
            });
        });

        function calculateAngle(a, b, c) {
            const ba = { x: a.x - b.x, y: a.y - b.y };
            const bc = { x: c.x - b.x, y: c.y - b.y };
            const dotProduct = (ba.x * bc.x) + (ba.y * bc.y);
            const magA = Math.sqrt(ba.x * ba.x + ba.y * ba.y);
            const magB = Math.sqrt(bc.x * bc.x + bc.y * bc.y);
            const cosine = dotProduct / (magA * magB + 1e-6);
            return Math.acos(Math.max(-1, Math.min(1, cosine))) * (180 / Math.PI);
        }

        async function startCamera() {
            if (isCameraRunning) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('Camera unavailable. Open this page using HTTPS and allow camera access.', '#FF1744');
                return;
            }

            cameraControlBtn.disabled = true;
            toggleCamBtn.disabled = true;
            setStatus('Requesting camera permission...', '#ff9800');

            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: useBackCamera ? { ideal: 'environment' } : { ideal: 'user' },
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });

                video.srcObject = activeStream;
                await video.play();
                camera = new Camera(video, {
                    onFrame: async () => pose.send({ image: video }),
                    width: 640,
                    height: 480
                });
                camera.start();
                isCameraRunning = true;
                sessionStartTime = Date.now();
                lastHistorySample = 0;
                postureHistory.length = 0;
                sessionAlertCount = 0;
                alertTimerStart = null;
                alertTriggered = false;
                cameraControlBtn.disabled = false;
                cameraControlBtn.textContent = '⏹️ Stop Camera';
                cameraControlBtn.classList.add('stop');
                toggleCamBtn.disabled = false;
                setStatus('Camera active — stand in view.', '#00E676');
                updateSessionSummary();
                drawHistoryChart();
            } catch (err) {
                isCameraRunning = false;
                cameraControlBtn.disabled = false;
                toggleCamBtn.disabled = true;
                setStatus(`Camera error: ${err.name || ''} ${err.message || err}`, '#FF1744');
            }
        }

        function stopCamera() {
            if (camera) {
                camera.stop();
                camera = null;
            }
            if (activeStream) {
                activeStream.getTracks().forEach((track) => track.stop());
                activeStream = null;
            }

            video.srcObject = null;
            isCameraRunning = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cameraControlBtn.textContent = '▶️ Start Camera';
            cameraControlBtn.classList.remove('stop');
            toggleCamBtn.disabled = true;
            setStatus('Camera is off. Press Start Camera when ready.', '#ff9800');
        }

        cameraControlBtn.addEventListener('click', () => {
            if (isCameraRunning) stopCamera();
            else startCamera();
        });

        toggleCamBtn.addEventListener('click', async () => {
            if (!isCameraRunning) return;
            useBackCamera = !useBackCamera;
            stopCamera();
            await startCamera();
        });

        clearHistoryBtn.addEventListener('click', () => {
            postureHistory.length = 0;
            lastHistorySample = 0;
            sessionAlertCount = 0;
            alertTimerStart = null;
            alertTriggered = false;
            updateSessionSummary();
            drawHistoryChart();
        });

        exportCsvBtn.addEventListener('click', exportCsv);
        updateSessionSummary();
        drawHistoryChart();
    </script>
</body>
</html>
